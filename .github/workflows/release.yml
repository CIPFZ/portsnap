name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: portsnap
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: portsnap.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: portsnap
          - os: macos-15
            target: aarch64-apple-darwin
            binary: portsnap
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Verify tag matches Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + v, "tag must match Cargo.toml version"'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive binary and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python scripts/package_release.py --binary 'target/${{ matrix.target }}/release/${{ matrix.binary }}' --target '${{ matrix.target }}' --version "$RELEASE_TAG" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish verified archives
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
