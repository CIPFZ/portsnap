[package]
name = "portsnap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Inspect local TCP and UDP endpoints and their owning processes"
repository = "https://github.com/CIPFZ/portsnap"
rust-version = "1.85"

[dependencies]
# 命令行参数解析
clap = { version = "4.4", features = ["derive"] }
# 结构化 JSON 报告
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# 错误处理
anyhow = "1.0"
# Windows 专用依赖
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Wdk_System_Threading", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Authorization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
# Linux procfs 协议表解析
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.16"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 生产环境编译配置
[profile.release]
opt-level = "z"     # 优化级别："z" 代表为体积优化 (Size)，"s" 也是体积优化但稍微兼顾速度
lto = true          # 开启链接时优化 (Link Time Optimization)，这会大幅减少死代码，但编译变慢
codegen-units = 1   # 降低并行代码生成单元，虽然慢但优化效果最好
panic = "abort"     # 发生 panic 时直接退出，不进行栈展开 (Unwind)，省去大量元数据
strip = true        # 自动剥离符号表 (相当于运行 strip 命令)，Rust 1.59+ 支持
